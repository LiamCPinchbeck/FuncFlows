[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "funcflows"
version = "0.1.3"
description = "Normalizing flows and flow matching on function spaces, with exact-trace vector fields"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Liam Pinchbeck"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# only what FuncFlows/ itself imports: torch everywhere, tqdm in utils/train.py
dependencies = ["torch", "torchvision", "tqdm", "scipy", "matplotlib"]

[project.optional-dependencies]
ot = ["scipy"]                       # optimal-transport coupling in flow matching (falls back without it)
test = ["pytest"]

[project.urls]
Homepage = "https://pypi.org/project/funcflows/"

[tool.setuptools.packages.find]
include = ["FuncFlows*"]