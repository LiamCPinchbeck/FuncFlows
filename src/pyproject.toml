[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "funcyflows"
version = "0.2.3"
description = "Normalizing flows and flow matching on function spaces"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Liam Pinchbeck"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# only what FuncyFlows/ itself imports: torch everywhere, tqdm in utils/train.py
dependencies = ["torch", "tqdm", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/LiamCPinchbeck/FuncFlows"
Documentation = "https://funcyflows.readthedocs.io/en/latest/"
Source = "https://github.com/LiamCPinchbeck/FuncFlows"

[tool.setuptools.packages.find]
include = ["FuncyFlows*"]